name: Supabase keep-alive

# Free-tier Supabase pauses after ~7 days of inactivity; ping every 4 days.
on:
  schedule:
    - cron: "0 8 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # lets the keepalive step re-enable this workflow via the API
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: ${{ secrets.SUPABASE_PGUSER }}
          PGPASSWORD: ${{ secrets.SUPABASE_PGPASSWORD }}
          PGSSLMODE: require
        run: |
          psql -tAc "select 'alive: ' || count(*) || ' courses' from courses;"

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow via the API on every run resets that clock.
      # (Done inline — the keepalive-workflow action this used to rely on was
      # TOS-blocked by GitHub, which made every run fail at setup.)
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-keepalive.yml/enable"
          echo "Workflow re-enabled; 60-day inactivity clock reset."
