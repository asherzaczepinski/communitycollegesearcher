name: Supabase keep-alive

# Free-tier Supabase pauses after ~7 days of inactivity; ping every 4 days.
on:
  schedule:
    - cron: "0 8 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: ${{ secrets.SUPABASE_PGUSER }}
          PGPASSWORD: ${{ secrets.SUPABASE_PGPASSWORD }}
          PGSSLMODE: require
        run: |
          psql -tAc "select 'alive: ' || count(*) || ' courses' from courses;"
